<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Bluetooth Command Center</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --panel-border: rgba(255, 255, 255, 0.08);
            
            --accent-blue: #38bdf8;
            --accent-blue-glow: rgba(56, 189, 248, 0.3);
            --accent-green: #4ade80;
            --accent-green-glow: rgba(74, 222, 128, 0.25);
            --accent-red: #f87171;
            --accent-red-glow: rgba(248, 113, 113, 0.25);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .dashboard {
            width: 100%;
            max-width: 680px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 14px;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-dim);
            box-shadow: 0 0 8px var(--text-dim);
            transition: all 0.4s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .main-action-btn {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .btn-connect {
            background: var(--accent-blue);
            color: #0f172a;
            box-shadow: 0 4px 20px var(--accent-blue-glow);
            border: none;
        }

        .btn-connect:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-blue-glow);
        }

        .btn-disconnect {
            background: rgba(248, 113, 113, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.2);
            display: none;
        }

        .btn-disconnect:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 4px 20px var(--accent-red-glow);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        .meta-item {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--text-muted);
        }
        
        .meta-item:last-child {
            margin-bottom: 0;
        }

        .meta-value {
            color: var(--text-main);
            font-weight: 500;
            font-family: monospace;
            display: block;
            margin-top: 2px;
            word-break: break-all;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100% - 25px);
            justify-content: center;
        }

        .btn-control {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-control.active-state {
            cursor: pointer;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-control.active-state:hover {
            background: var(--text-main);
            color: #0f172a;
        }

        .terminal-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .terminal-screen {
            font-family: 'Courier New', Courier, monospace;
            height: 140px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #a7f3d0;
            padding-right: 5px;
        }

        .terminal-screen::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-screen::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .log-line {
            margin-bottom: 6px;
            line-height: 1.5;
            opacity: 0.85;
        }
        
        .log-line.system { color: var(--text-dim); }
        .log-line.error { color: var(--accent-red); }
        .log-line.success { color: var(--accent-green); }

        @media (max-width: 580px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
            .dashboard {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>BLE Command Center</h1>
        <div class="status-container">
            <div id="statusDot" class="status-dot"></div>
            <div id="statusText" class="status-text">Disconnected</div>
        </div>
    </header>

    <button id="connectBtn" class="main-action-btn btn-connect">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        Scan & Connect Peripherals
    </button>
    <button id="disconnectBtn" class="main-action-btn btn-disconnect">Disconnect Session</button>

    <div class="grid-layout">
        <!-- Metadata Panel -->
        <div class="panel">
            <div class="panel-title">Device Metadata</div>
            <div class="meta-item">Device Name <span id="deviceName" class="meta-value">—</span></div>
            <div class="meta-item">Hardware ID <span id="deviceId" class="meta-value">—</span></div>
        </div>

        <!-- Hardware Control Panel -->
        <div class="panel">
            <div class="panel-title">Hardware Actions</div>
            <div class="control-row">
                <button id="actionOnBtn" class="btn-control" disabled>Trigger Signal ON</button>
                <button id="actionOffBtn" class="btn-control" disabled>Trigger Signal OFF</button>
            </div>
        </div>
    </div>

    <!-- Logger Terminal -->
    <div class="terminal-panel">
        <div class="panel-title">Output Terminal</div>
        <div id="terminalScreen" class="terminal-screen">
            <div class="log-line system">[system] Core engine initialized. Awaiting connection command...</div>
        </div>
    </div>
</div>

<script>
    // Configuration Variables (Configure to match your BLE peripherals)
    const TARGET_SERVICE_UUID = 'generic_access'; 
    const TARGET_CHARACTERISTIC_UUID = 'device_name'; 

    let bluetoothDevice = null;
    let dataCharacteristic = null;

    // UI Document Mapping
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const deviceName = document.getElementById('deviceName');
    const deviceId = document.getElementById('deviceId');
