<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nike | Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">NIKE</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="nav-right">
        <input type="text" class="search" placeholder="Search">
        <span class="cart">🛒</span>
    </div>
</header>

<section class="products-section">

    <div class="section-heading">
        <h1>All Products</h1>

        <select class="filter">
            <option>Sort by</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
            <option>Popular</option>
        </select>
    </div>

    <div class="product-grid">

        <div class="product-card">

            <div class="heart">♡</div>

            <div class="product-image">
                <img
                    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
                    alt="Nike Air Max">
            </div>

            <div class="product-info">

                <p class="category">Men's Shoes</p>

                <h3>Nike Air Max 270</h3>

                <p class="rating">⭐⭐⭐⭐⭐</p>

                <p class="price">₹12,995</p>

                <div class="sizes">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                </div>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>
        </div>


        <div class="product-card">

            <div class="heart">♡</div>

            <div class="product-image">
                <img
                    src="https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?auto=format&fit=crop&w=700&q=80"
                    alt="Nike Air Force">
            </div>

            <div class="product-info">

                <p class="category">Men's Shoes</p>

                <h3>Nike Air Force 1</h3>

                <p class="rating">⭐⭐⭐⭐⭐</p>

                <p class="price">₹9,995</p>

                <div class="sizes">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                </div>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>
        </div>


        <div class="product-card">

            <div class="heart">♡</div>

            <div class="product-image">
                <img
                    src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=700&q=80"
                    alt="Nike Jordan">
            </div>

            <div class="product-info">

                <p class="category">Men's Shoes</p>

                <h3>Nike Air Jordan</h3>

                <p class="rating">⭐⭐⭐⭐⭐</p>

                <p class="price">₹14,995</p>

                <div class="sizes">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                </div>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>
        </div>


        <div class="product-card">

            <div class="heart">♡</div>

            <div class="product-image">
                <img
                    src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=700&q=80"
                    alt="Nike Running Shoe">
            </div>

            <div class="product-info">

                <p class="category">Running Shoes</p>

                <h3>Nike Air Zoom</h3>

                <p class="rating">⭐⭐⭐⭐⭐</p>

                    <button>7</button>

                </div>

                <button class="add-cart">
                    Add to Cart

</section>

<footer>
    <h3>NIKE</h3>
    <p>Just Do It.</p>
</footer>

<script src="script.js"></script>
